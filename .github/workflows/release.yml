name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Name the build
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v0.0.0-dev"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Publish
        shell: bash
        run: |
          version="$VERSION"
          common="-c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:DebugType=none -p:Version=$version"
          dotnet publish src/Lustrum.App $common -p:IncludeNativeLibrariesForSelfExtract=true -o out/app
          dotnet publish src/Lustrum.Cli $common -o out/cli
      - name: Package
        shell: bash
        run: |
          version="$VERSION"
          name="lustrum-${TAG}-${{ matrix.rid }}"
          mkdir -p dist
          case "${{ matrix.rid }}" in
            osx-*)
              build/package-macos.sh "$version" out/app out/cli "dist/${name}.zip"
              ;;
            linux-*)
              build/package-linux.sh out/app "dist/Lustrum-${TAG}-x86_64.AppImage"
              mkdir -p stage/lustrum/cli && cp -R out/app/. stage/lustrum/ && cp -R out/cli/. stage/lustrum/cli/
              tar -czf "dist/${name}.tar.gz" -C stage lustrum
              ;;
            win-*)
              mkdir -p stage/lustrum/cli && cp -R out/app/. stage/lustrum/ && cp -R out/cli/. stage/lustrum/cli/
              (cd stage && zip -qr "../dist/${name}.zip" lustrum)
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
