name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, osx-arm64, osx-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish app
        run: >
          dotnet publish src/Lustrum.App -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${GITHUB_REF_NAME#v}
          -o out/lustrum
      - name: Publish CLI
        run: >
          dotnet publish src/Lustrum.Cli -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${GITHUB_REF_NAME#v}
          -o out/lustrum/cli
      - name: Archive
        shell: bash
        run: |
          name="lustrum-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          cd out
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -qr "../${name}.zip" lustrum
          else
            tar -czf "../${name}.tar.gz" lustrum
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: lustrum-*

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
